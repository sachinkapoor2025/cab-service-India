<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Created - Cab & Shared Mobility</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
      <div class="max-w-md w-full bg-white rounded-lg shadow-md p-6">
        <div class="text-center">
          <div
            class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4"
          >
            <svg
              class="h-6 w-6 text-green-600"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              ></path>
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-gray-900 mb-2">
            Account Created Successfully!
          </h2>
          <p class="text-gray-600 mb-6">
            Please check your email for a verification link. Click the link to
            verify your account and complete the registration process.
          </p>
          <div class="space-y-3">
            <button
              onclick="window.location.href = '/auth'"
              class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              Go to Login
            </button>
            <button
              onclick="window.location.href = '/'"
              class="w-full bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500"
            >
              Back to Home
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Check if there are any URL parameters for verification
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");
      const confirmed = urlParams.get("confirmed");

      if (code || confirmed) {
        // Handle verification callback
        document.querySelector("h2").textContent = "Account Verified!";
        document.querySelector("p").textContent =
          "Your account has been successfully verified. You can now log in.";
      }
    </script>
  </body>
</html>
