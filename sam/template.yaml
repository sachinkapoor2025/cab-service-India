AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cab & Shared Mobility Platform - Backend

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        DRIVERS_TABLE: !Ref DriversTable
        RIDES_TABLE: !Ref RidesTable
        BOOKINGS_TABLE: !Ref BookingsTable
        SNS_TOPIC: !Ref EmergencySNSTopic

Resources:
  # -------------------- DynamoDB --------------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CabUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PhoneIndex
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  DriversTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CabDrivers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: phone
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PhoneIndex
          KeySchema:
            - AttributeName: phone
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  RidesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CabRides
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: driverId
          AttributeType: S
        - AttributeName: route
          AttributeType: S
        - AttributeName: dateTime
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DriverIndex
          KeySchema:
            - AttributeName: driverId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: RouteDateIndex
          KeySchema:
            - AttributeName: route
              KeyType: HASH
            - AttributeName: dateTime
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CabBookings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: rideId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: RideIndex
          KeySchema:
            - AttributeName: rideId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # -------------------- SNS --------------------
  EmergencySNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: CabEmergencyAlerts

  # -------------------- S3 --------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cab-frontend-${AWS::StackName}
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicAccess: false

  # -------------------- API --------------------
  CabApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"

  # -------------------- Lambda Functions --------------------
  UserManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/userController.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        UsersApi:
          Type: Api
          Properties:
            RestApiId: !Ref CabApi
            Path: /users
            Method: ANY

  DriverManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/driverController.handler
      Events:
        DriversApi:
          Type: Api
          Properties:
            RestApiId: !Ref CabApi
            Path: /drivers
            Method: ANY

  RideManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/rideController.handler
      Events:
        RidesApi:
          Type: Api
          Properties:
            RestApiId: !Ref CabApi
            Path: /rides
            Method: ANY

  BookingManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/bookingController.handler
      Events:
        BookingsApi:
          Type: Api
          Properties:
            RestApiId: !Ref CabApi
            Path: /bookings
            Method: ANY

  FareCalculationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: services/fareService.handler
      Events:
        FareApi:
          Type: Api
          Properties:
            RestApiId: !Ref CabApi
            Path: /fare
            Method: POST

  EmergencyAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: services/emergencyService.handler
      Events:
        EmergencyApi:
          Type: Api
          Properties:
            RestApiId: !Ref CabApi
            Path: /emergency
            Method: POST

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${CabApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  FrontendBucketName:
    Description: S3 Bucket for Frontend
    Value: !Ref FrontendBucket
